<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Login System</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-auth.js"></script>
</head>

<body>
  <div class="wrapper">
    <h2>Firebase Login</h2>
    <div class="input-group">
      <input type="email" id="email" placeholder="Email" required>
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Password" required>
    </div>
    <button onclick="loginUser()">Login</button>
    <p id="message"></p>
  </div>

  <script src="firebase-config.js"></script>
  <script src="firebase-login.js"></script>
</body>

</html>
